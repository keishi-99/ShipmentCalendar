name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ShipmentCalendar.slnx

      - name: Build
        run: dotnet build ShipmentCalendar.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ShipmentCalendar.Tests/ShipmentCalendar.Tests.csproj --no-build --configuration Release --verbosity normal
